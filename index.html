<script>

const trailSettings = {

icons: ["/.CuteDesktop/SMALLPIXELS/iforgothaloween.gif","http://fosteringbliss.com/images/mouse.gif"],

amount: 2,

density: 4,

size: 17,

glow: 21,

rotation: 332,

spinSpeed: 0,

rotationRandomness: 0,

variation: 7,

rainbow: "off",

movement: "random"

};

document.addEventListener("mousemove",(e)=>{

    let spawnChance;

    switch(trailSettings.density){

        case 1: spawnChance=.01; break;
        case 2: spawnChance=.03; break;
        case 3: spawnChance=.06; break;
        case 4: spawnChance=.12; break;
        case 5: spawnChance=.25; break;
        case 6: spawnChance=.45; break;
        case 7: spawnChance=.70; break;
        default: spawnChance=1;

    }

    if(Math.random()>spawnChance) return;

    for(let i=0;i<trailSettings.amount;i++){

        let img=document.createElement("img");

        img.src=
        trailSettings.icons[
            Math.floor(
                Math.random()*
                trailSettings.icons.length
            )
        ];

        img.style.position="fixed";
        img.style.pointerEvents="none";
        img.style.zIndex="99999";

        let finalSize=
        trailSettings.size+
        (Math.random()*trailSettings.variation);

        img.style.width=
        finalSize+"px";

        img.style.left=
        (e.clientX+
        (Math.random()*16-8))
        +"px";

        img.style.top=
        (e.clientY+
        (Math.random()*16-8))
        +"px";

        let glowColor="hotpink";

        if(trailSettings.rainbow==="pastel"){

            glowColor=
            `hsl(${Math.random()*360},80%,80%)`;

        }

        if(trailSettings.rainbow==="bright"){

            glowColor=
            `hsl(${Math.random()*360},100%,50%)`;

        }

        img.style.filter=
        `drop-shadow(
        0 0 ${trailSettings.glow}px
        ${glowColor}
        )`;

        let rot=
        Math.random()*
        trailSettings.rotation;
        
        let chance =
trailSettings.rotationRandomness / 100;

if(Math.random() < chance){

    rot *= -1;

}

        img.style.transform=
        `rotate(${rot}deg)`;

        document.body.appendChild(img);

        let tx=0;
        let ty=40;




if(trailSettings.movement==="still"){
    tx=0;
    ty=0;
}


        if(trailSettings.movement==="up"){
            ty=-40;
        }
        else if(trailSettings.movement==="left"){
            tx=-40;
            ty=0;
        }
        else if(trailSettings.movement==="right"){
            tx=40;
            ty=0;
        }
        
        
        else if(trailSettings.movement==="explode1"){
    tx=Math.random()*150-60;
    ty=Math.random()*150-60;
}
        
        
else if(trailSettings.movement==="explode"){
    tx=Math.random()*350-200;
    ty=Math.random()*350-200;
}
        else if(trailSettings.movement==="random"){
            tx=Math.random()*80-40;
            ty=Math.random()*80-40;
        }
        
        
        
        else if(trailSettings.movement==="tinyfloat"){
    tx=Math.random()*8-4;
    ty=-10;
}

        img.style.transition=
        "all 1.2s linear";

       setTimeout(()=>{

    img.style.opacity="0";

    let endRotation = rot;

    if(trailSettings.spinSpeed > 0){

        let direction = 1;

        if(
            trailSettings.rotationRandomness > 0
        ){

            let chance =
            trailSettings.rotationRandomness / 200;

            if(Math.random() < chance){

                direction = -1;

            }

        }

        endRotation =
        rot +
        (
            (trailSettings.spinSpeed * 2)
            * direction
        );

    }
img.style.transform=
`translate(${tx}px,${ty}px)
 rotate(${endRotation}deg)`;

},20);

        setTimeout(()=>{
            img.remove();
        },1250);

    }

});

</script>
